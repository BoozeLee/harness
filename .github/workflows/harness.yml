# Generated by `harness ci` — regenerate with `harness ci`; do not edit by hand.
name: harness
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - run: "pip install ."
      - run: "harness scan --fail-under 70"
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - run: "pip install uv"
      - run: "uv sync --frozen"
      - run: "cd web && npm ci --no-fund --no-audit"
      - run: "cd web && npx playwright install --with-deps chromium"
      - name: gate unit
        run: "uv run pytest -q"
      - name: gate lint
        run: "uv run ruff check ."
      - name: gate typecheck
        run: "uv run mypy harness/"
      - name: gate playwright
        run: "cd web && npm ci --no-audit --no-fund && npx playwright test e2e/dashboard.spec.ts"
      - name: gate elohim
        run: "python3 vendor/elohim/scripts/elohim_run.py"
