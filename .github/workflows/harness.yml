# Generated by `harness ci` — regenerate with `harness ci`; do not edit by hand.
name: harness
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: "pip install ."
      - run: "harness scan --fail-under 70"
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: "pip install uv"
      - run: "uv sync --frozen"
      - run: "cd web && npm ci --no-fund --no-audit"
      - run: "cd web && npx playwright install --with-deps chromium"
      - name: gate unit
        run: "uv run pytest -q"
      - name: gate lint
        run: "uv run ruff check ."
      - name: gate typecheck
        run: "uv run mypy harness/"
      - name: gate playwright
        run: "cd web && npm ci --no-audit --no-fund && npx playwright test e2e/dashboard.spec.ts"
      - name: gate elohim
        run: "python3 vendor/elohim/scripts/elohim_run.py"
