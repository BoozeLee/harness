name: Publish to PyPI

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Third-party actions are blocked by org policy; uv publish does OIDC trusted publishing itself.
      - run: pip install uv
      - run: uv build
      - run: uv publish --trusted-publishing always
