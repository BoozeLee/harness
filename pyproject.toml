[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness-agent"
version = "0.2.0"
description = "Local-first control plane that professionalizes how coding agents work on a repo."
requires-python = ">=3.10"

[project.scripts]
harness = "harness.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.ruff]
line-length = 110
exclude = ["web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
check_untyped_defs = true
python_version = "3.10"
exclude = ["^web/"]
